name: firebase_ai_tvos
description: >-
  tvOS (Apple TV) implementation of the firebase_ai Flutter plugin, providing
  Firebase AI Logic (Gemini generative models) on Apple TV.
version: 0.0.1
homepage: https://fluttertv.dev
repository: https://github.com/fluttertv/plugins/tree/main/packages/firebase_ai_tvos
issue_tracker: https://github.com/fluttertv/plugins/issues
# Generated by `flutter-tvos plugin port`, then finished by hand. See PORTING_REPORT.md.
# License holder: fluttertv

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_ai: ^3.13.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      tvos:
        pluginClass: FirebaseAIPlugin
