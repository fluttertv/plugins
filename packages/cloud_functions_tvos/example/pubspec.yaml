name: cloud_functions_example
description: Demonstrates how to use the cloud_functions plugin on tvOS.
publish_to: none

environment:
  sdk: '^3.6.0'
  flutter: '>=3.27.0'

dependencies:
  # firebase_core is pinned exact; its train picks the matching firebase_core_tvos
  # (4.14.x -> pi 8.1.1 -> 0.0.3 and later); floating it breaks the native
  # Pigeon ABI. firebase_core_tvos 0.0.4 requires firebase_core ^4.13.0.
  cloud_functions: 6.3.6
  cloud_functions_tvos:
    path: ../
  firebase_core: 4.14.0
  firebase_core_tvos: ^0.0.4
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
