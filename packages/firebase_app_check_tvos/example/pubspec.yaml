name: firebase_app_check_example
description: Demonstrates how to use the firebase_app_check plugin on tvOS.
publish_to: none

environment:
  sdk: '^3.6.0'
  flutter: '>=3.27.0'

dependencies:
  # firebase_core is pinned exact and firebase_core_tvos floored to match:
  # 0.4.7 needs pi ^8.1.1 (the 4.14.x train), which only core_tvos 0.0.3 accepts.
  firebase_core: 4.14.0
  firebase_app_check: 0.4.7
  firebase_app_check_tvos:
    path: ../
  firebase_core_tvos: ^0.0.4
  flutter:
    sdk: flutter

# This plugin requires firebase_core_tvos ^0.0.4 (the first with a
# tvos/Package.swift). Resolve it from the sibling package so the example
# builds before that version is on pub.dev, and builds what this repo has.
dependency_overrides:
  firebase_core_tvos:
    path: ../../firebase_core_tvos

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
