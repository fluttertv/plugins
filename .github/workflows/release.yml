name: Release

# Merge to main → CI green → tag → publish to pub.dev.
#
# Runs after CI finishes on a push to main, and only if it succeeded, so a
# release never goes out from a commit CI rejected. release_plan.py picks the
# packages whose pubspec version is not on pub.dev yet (and checks that the
# version tops CHANGELOG.md and is newer than what pub.dev has). Each candidate
# is re-verified on exactly that commit — analyse, test, `flutter pub publish
# --dry-run` — then tagged `<package>-v<version>`, and publish.yml is
# dispatched on the tag.
#
# Why dispatch instead of letting the tag push trigger publish.yml: a tag
# created with GITHUB_TOKEN does not trigger `on: push` workflows (GitHub's
# guard against recursive runs), but a workflow_dispatch from GITHUB_TOKEN is
# allowed. pub.dev accepts both events from a tag ref once each package has
# "workflow_dispatch" enabled in its automated-publishing settings. No PAT or
# app token is needed. Pushing a tag by hand still works through `on: push`.
#
# workflow_dispatch here re-runs the plan on the tip of main — the way to
# retry after fixing pub.dev settings, or when back-to-back merges made CI
# skip a commit (see the concurrency note in ci.yml). It only runs when
# dispatched on main; any other ref is refused, so an unmerged branch can
# never be tagged.
#
# A tag that already exists is re-dispatched only when it points at the commit
# this run verified and no Publish run for it is still active (running, or
# waiting for approval in the pub.dev environment). A tag on an older commit
# fails the run: publishing it would ship code this run never checked. Bump the
# version, or delete the tag if its publish never happened.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel: a half-finished release (tagged, not dispatched) is the one
  # state this workflow should not leave behind.
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      candidates: ${{ steps.plan.outputs.candidates }}
      problems: ${{ steps.plan.outputs.problems }}
      flutter: ${{ steps.flutter.outputs.version }}
    steps:
      - id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}

      # Only ever release what main points at. A workflow_run for an older
      # commit can arrive after a newer one has landed; its packages will be
      # picked up by the newer commit's own run.
      # A dispatch is on main already (see the job's `if`); checking it too
      # costs nothing and catches a push that landed while it queued.
      - name: Commit is still on main
        run: |
          git fetch --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "${{ steps.sha.outputs.sha }}" ]; then
            echo "::notice::main has moved past ${{ steps.sha.outputs.sha }}; the newer run releases."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      # One source of truth for the Flutter version: the one CI just passed with.
      - id: flutter
        run: |
          v=$(sed -n 's/^  FLUTTER_VERSION: *"\(.*\)".*/\1/p' .github/workflows/ci.yml)
          [ -n "$v" ] || { echo "::error::FLUTTER_VERSION not found in ci.yml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Ensure PyYAML
        run: python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml

      - id: plan
        run: |
          if [ "${SKIP:-}" = 1 ]; then
            echo "candidates=[]" >> "$GITHUB_OUTPUT"
            echo "problems=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/scripts/release_plan.py . --github-output

  release:
    name: ${{ matrix.package }} ${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.candidates != '[]' && needs.plan.outputs.candidates != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag
      actions: write # dispatch publish.yml
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.candidates) }}
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      # An existing tag: publish only what this run verifies, and never start
      # a second Publish for a tag whose first one is still going.
      - name: Tag state
        id: state
        if: ${{ matrix.tag_exists }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          TAG_SHA: ${{ matrix.tag_sha }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish.yml \
            --branch "$TAG" --limit 20 --json status \
            --jq '[.[] | select(.status != "completed")] | length')
          if [ "$active" != 0 ]; then
            echo "::notice::A Publish run for $TAG is still active (running or awaiting approval); not dispatching another."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$TAG_SHA" != "$SHA" ]; then
            echo "::error::$TAG points at $TAG_SHA, not $SHA, and pub.dev does not have it. Publishing it would ship a commit this run did not verify. Bump the version, or delete the tag if that publish never happened."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.state.outputs.skip != '1'
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: subosito/flutter-action@v2
        if: steps.state.outputs.skip != '1'
        with:
          flutter-version: ${{ needs.plan.outputs.flutter }}
          channel: stable
          cache: true

      - name: flutter pub get
        if: steps.state.outputs.skip != '1'
        run: flutter pub get

      # Same checks as CI's package job. CI already passed on this commit;
      # repeating the package's own half costs a minute and means the tag is
      # placed by a job that saw the checks pass, not one that trusted a status.
      - name: dart analyze
        if: steps.state.outputs.skip != '1'
        run: |
          dart analyze lib
          if [ -d test ]; then dart analyze test; fi

      - name: flutter test
        if: steps.state.outputs.skip != '1'
        run: |
          if find test -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo "::warning::no tests to run"
          fi

      # Exits non-zero on warnings; hints (such as the pubspec_overrides one
      # the firebase packages get) do not fail it.
      - name: flutter pub publish --dry-run
        if: steps.state.outputs.skip != '1'
        run: flutter pub publish --dry-run

      - name: Tag ${{ matrix.tag }}
        if: ${{ !matrix.tag_exists }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/${{ matrix.tag }}" \
            -f sha="${{ needs.plan.outputs.sha }}"

      - name: Dispatch publish on ${{ matrix.tag }}
        if: steps.state.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml --repo "${{ github.repository }}" --ref "${{ matrix.tag }}"
          echo "Publishing ${{ matrix.package }} ${{ matrix.version }} — follow it under the Publish workflow." >> "$GITHUB_STEP_SUMMARY"

  # Packages whose metadata release_plan.py rejected (version not on top of
  # CHANGELOG.md, not newer than pub.dev, ...). Kept out of `plan` so the
  # healthy packages in the same merge still release, but the run ends red.
  problems:
    needs: [plan, release]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.problems != '0' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::${{ needs.plan.outputs.problems }} package(s) were not released; see the plan job's errors."
          exit 1
