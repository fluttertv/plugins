name: Publish

# Publishes one package to pub.dev from a `<package>-v<version>` tag, using
# pub.dev automated publishing (GitHub OIDC — no stored credentials).
#
# Normally dispatched by release.yml on the tag it just created. Pushing such a
# tag by hand also works. Either way pub.dev itself checks that the event came
# from this repository, from a tag matching the package's configured pattern
# `<package>-v{{version}}`, and from the `pub.dev` environment.
#
# The `resolve` job is a guard, not the security boundary: it refuses a tag
# whose name does not agree with the package's pubspec and changelog, so a
# mistyped tag fails here with a sentence instead of at pub.dev with a 403.
# It also refuses a tag on a commit that is not on main: the tag patterns on
# pub.dev and in the environment limit the tag's *name*, not which commit it
# points at, and only main has been through review and CI.

on:
  push:
    tags:
      - "*_tvos-v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PyYAML
        run: python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
      - name: Tagged commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # identical: main is this commit; behind: main has it as an ancestor.
          state=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          case "$state" in
            identical|behind) echo "$GITHUB_SHA is on main ($state)." ;;
            *) echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main ($state). Only merged commits are published."
               exit 1 ;;
          esac
      - id: parse
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != tag ]; then
            echo "::error::Publish must run on a tag ref (got $REF_TYPE '$TAG'). Dispatch it with --ref <package>-v<version>."
            exit 1
          fi
          python3 - <<'PY'
          import os, re, sys
          sys.path.insert(0, ".github/scripts")
          from check_repo import load_yaml, newest_changelog_version, read_text
          tag = os.environ["TAG"]
          m = re.fullmatch(r"([a-z0-9_]+)-v(.+)", tag)
          if not m:
              sys.exit(f"::error::Tag '{tag}' is not <package>-v<version>.")
          pkg, version = m.groups()
          d = os.path.join("packages", pkg)
          pubspec, err = load_yaml(os.path.join(d, "pubspec.yaml"))
          if err or not isinstance(pubspec, dict):
              sys.exit(f"::error::No readable packages/{pkg}/pubspec.yaml ({err}).")
          if pubspec.get("version") != version:
              sys.exit(f"::error::Tag says {version}, pubspec.yaml says {pubspec.get('version')}.")
          text, _ = read_text(os.path.join(d, "CHANGELOG.md"))
          top, heading = newest_changelog_version(text or "")
          if top != version:
              sys.exit(f"::error::Newest CHANGELOG heading is '{heading}', not {version}.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"package={pkg}\nversion={version}\n")
          print(f"Publishing {pkg} {version}")
          PY

  publish:
    name: ${{ needs.resolve.outputs.package }} ${{ needs.resolve.outputs.version }}
    needs: resolve
    permissions:
      id-token: write # OIDC token for pub.dev
    # dart-lang's reusable workflow: one job in `environment` that checks out
    # the tag, installs Dart and the newest Flutter stable (not CI's pinned
    # version; Release's dry-run used the pinned one), then runs `pub get`,
    # `pub publish --dry-run` and `pub publish -f` with the OIDC token. Its
    # only inputs are `environment` and `working-directory`.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev
      working-directory: packages/${{ needs.resolve.outputs.package }}
